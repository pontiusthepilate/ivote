app = "ivote"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"

[[mounts]]
  source = "ivote_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2
